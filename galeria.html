<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens Premium - Identidade Visual Preservada</title>
    <!-- Incluindo a mesma fonte da imagem original: Inter ou similar -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Configuração Rápida do Tailwind para a Paleta da Imagem -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'off-white': '#FDFCFB', // Fundo principal da imagem
                        'cor-texto': '#202A36', // Cor do texto principal
                        'bege-claro': '#E9E1D6', // Cor Bege para botões ativos
                        'bege-hover': '#DFD5C6', // Tom de hover para o Bege
                        'grafite': '#4A4D4A',     // Cor de fundo do contêiner da galeria
                        'cinza-claro': '#EFEFEF', // Cinza claro
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    letterSpacing: {
                        'caps': '0.3em',
                        'caps-sm': '0.15em',
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Estilos específicos para a animação suave e efeitos */
        .premium-gallery-slide {
            transition: opacity 300ms ease-in-out, transform 300ms ease-in-out;
        }

        .premium-gallery-slide.hidden-slide {
            opacity: 0;
            transform: translateY(10px);
        }

        .img-hover-effect {
            transition: transform 0.6s ease;
        }
        
        .img-container:hover .img-hover-effect {
            transform: scale(1.04);
        }

        /* Esconder scrollbar no carrossel mobile */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none; /* IE e Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-off-white font-sans text-cor-texto antialiased">

    <!-- ================= SEÇÃO PREMIUM DE GALERIA ================= -->
    <section class="w-full py-16 md:py-24" aria-labelledby="galeria-titulo">
        
        <!-- Cabeçalho & Menu de Categorias (Alinhado à Estrutura da Imagem Original) -->
        <div class="max-w-7xl mx-auto px-6 mb-12 md:mb-16">
            <div class="max-w-xl">
                <!-- Tag superior em caps, seguindo 'BEM-ESTAR' -->
                <span class="block text-xs tracking-caps uppercase font-light text-cor-texto/70 mb-2">Explore os detalhes</span>
                <!-- Título principal com a tipografia elegante -->
                <h2 id="galeria-titulo" class="text-3xl md:text-4xl font-light text-cor-texto leading-tight mb-8">
                    Um mergulho na <span class="font-bold">arquitetura contemporânea</span>
                </h2>
            </div>

            <!-- Menu de Categorias: Botões Arredondados Centrados -->
            <nav class="w-full border-t border-gray-100 pt-8 mt-8" aria-label="Categorias da Galeria">
                <ul class="flex justify-center items-center gap-3 md:gap-4 flex-wrap" role="tablist">
                    <li role="presentation">
                        <button 
                            id="tab-fachadas"
                            role="tab"
                            aria-selected="true"
                            aria-controls="gallery-grid"
                            class="category-btn active-btn text-xs tracking-caps uppercase px-6 py-3 rounded-full font-medium transition-all duration-300 focus:outline-none focus:ring-1 focus:ring-bege-hover"
                            onclick="selectCategory('fachadas')"
                        >
                            Fachadas
                        </button>
                    </li>
                    <li role="presentation">
                        <button 
                            id="tab-comuns"
                            role="tab"
                            aria-selected="false"
                            aria-controls="gallery-grid"
                            class="category-btn text-xs tracking-caps uppercase px-6 py-3 rounded-full font-medium transition-all duration-300 border border-white hover:border-bege hover:bg-white/50 focus:outline-none focus:ring-1 focus:ring-bege-hover text-cor-texto"
                            onclick="selectCategory('comuns')"
                        >
                            Áreas Comuns
                        </button>
                    </li>
                    <li role="presentation">
                        <button 
                            id="tab-apartamentos"
                            role="tab"
                            aria-selected="false"
                            aria-controls="gallery-grid"
                            class="category-btn text-xs tracking-caps uppercase px-6 py-3 rounded-full font-medium transition-all duration-300 border border-white hover:border-bege hover:bg-white/50 focus:outline-none focus:ring-1 focus:ring-bege-hover text-cor-texto"
                            onclick="selectCategory('apartamentos')"
                        >
                            Apartamentos
                        </button>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Área da Galeria com Fundo Grafite (#4A4D4A) -->
        <div class="bg-grafite w-full py-16 px-4 md:px-0">
            <div class="max-w-[1500px] mx-auto relative group">
                
                <!-- Estrutura da Galeria: Flex-Mobile, Grid-Desktop -->
                <div 
                    id="gallery-grid" 
                    class="flex md:grid md:grid-cols-10 items-center gap-4 md:gap-6 overflow-x-auto snap-x snap-mandatory no-scrollbar md:overflow-visible py-4"
                    role="region"
                    aria-live="polite"
                >
                    
                    <!-- Imagem Lateral Esquerda (Vertical - 20%) -->
                    <article 
                        id="slide-left"
                        class="premium-gallery-slide img-container flex-none w-[75vw] md:w-auto md:col-span-2 aspect-[3/4] relative overflow-hidden rounded-[2px] snap-center shadow-2xl cursor-pointer"
                        onclick="navigateGallery(-1)"
                    >
                        <img id="img-left" src="" alt="" loading="lazy" class="w-full h-full object-cover img-hover-effect">
                        <div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition-opacity duration-300"></div>
                    </article>

                    <!-- Imagem Principal Central (Destaque - 60%) -->
                    <article 
                        id="slide-center"
                        class="premium-gallery-slide img-container flex-none w-[85vw] md:w-auto md:col-span-6 aspect-[16/10] relative overflow-hidden rounded-[2px] snap-center shadow-2xl z-10"
                    >
                        <img id="img-center" src="" alt="" loading="lazy" class="w-full h-full object-cover img-hover-effect">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-80 group-hover:opacity-60 transition-opacity duration-300"></div>
                        <div class="absolute bottom-6 left-6 right-6">
                            <span id="label-category" class="text-[10px] tracking-caps-sm uppercase text-bege-claro mb-1 block"></span>
                            <h3 id="label-title" class="text-lg md:text-xl font-light text-white uppercase tracking-caps-sm"></h3>
                        </div>
                    </article>

                    <!-- Imagem Lateral Direita (Vertical - 20%) -->
                    <article 
                        id="slide-right"
                        class="premium-gallery-slide img-container flex-none w-[75vw] md:w-auto md:col-span-2 aspect-[3/4] relative overflow-hidden rounded-[2px] snap-center shadow-2xl cursor-pointer"
                        onclick="navigateGallery(1)"
                    >
                        <img id="img-right" src="" alt="" loading="lazy" class="w-full h-full object-cover img-hover-effect">
                        <div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition-opacity duration-300"></div>
                    </article>

                </div>

                <!-- Setas de Navegação Discretas (Sobre as laterais) -->
                <button 
                    onclick="navigateGallery(-1)" 
                    aria-label="Imagem Anterior"
                    class="absolute left-4 md:-left-8 top-1/2 -translate-y-1/2 z-20 w-12 h-12 bg-off-white/70 hover:bg-off-white rounded-full flex items-center justify-center text-cor-texto shadow-lg transition-all focus:outline-none focus:ring-1 focus:ring-bege-hover"
                >
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <button 
                    onclick="navigateGallery(1)" 
                    aria-label="Próxima Imagem"
                    class="absolute right-4 md:-right-8 top-1/2 -translate-y-1/2 z-20 w-12 h-12 bg-off-white/70 hover:bg-off-white rounded-full flex items-center justify-center text-cor-texto shadow-lg transition-all focus:outline-none focus:ring-1 focus:ring-bege-hover"
                >
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>

        <!-- Botão de Ação Inferior (Estilo 'AGENDAR VISITA') -->
        <div class="mt-16 text-center">
            <a href="#" class="inline-block bg-bege-claro text-cor-texto text-xs tracking-caps uppercase py-4 px-10 rounded-full font-medium hover:bg-bege-hover transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-bege-hover">
                Saiba Mais
            </a>
        </div>

    </section>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // Dados de Exemplo das Categorias (6 imagens por categoria)
        const galleryData = {
            fachadas: [
                { url: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1400', title: 'Fachada Principal Diurna' },
                { url: 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?q=80&w=1400', title: 'Arquitetura de Noite' },
                { url: 'https://images.unsplash.com/photo-1600565192348-78c53026a0a0?q=80&w=1400', title: 'Detalhes Construtivos' },
                { url: 'https://images.unsplash.com/photo-1600585154526-990dcea4d0d1?q=80&w=1400', title: 'Entrada Monumental' },
                { url: 'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?q=80&w=1400', title: 'Vista Panorâmica' },
                { url: 'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?q=80&w=1400', title: 'Jardins Externos' },
            ],
            comuns: [
                { url: 'https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?q=80&w=1400', title: 'Piscina com Borda Infinita' },
                { url: 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1400', title: 'Academia Wellness' },
                { url: 'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?q=80&w=1400', title: 'Salão de Festas Gourmet' },
                { url: 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=1400', title: 'Lounge Fireplace' },
                { url: 'https://images.unsplash.com/photo-1600565193348-f74bd3c7ccdf?q=80&w=1400', title: 'Hall de Entrada Duplo' },
                { url: 'https://images.unsplash.com/photo-1533105079780-92b9be482077?q=80&w=1400', title: 'Rooftop 360 View' },
            ],
            apartamentos: [
                { url: 'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?q=80&w=1400', title: 'Sala Integrada com Varanda' },
                { url: 'https://images.unsplash.com/photo-1600585152220-90363fe7e115?q=80&w=1400', title: 'Cozinha Minimalista' },
                { url: 'https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?q=80&w=1400', title: 'Suíte Master Panorâmica' },
                { url: 'https://images.unsplash.com/photo-1512918728675-ed5a9ecdebfd?q=80&w=1400', title: 'Varanda Gourmet' },
                { url: 'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?q=80&w=1400', title: 'Dormitório Master' },
                { url: 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=1400', title: 'Banho Master em Mármore' },
            ]
        };

        // Estado do Carrossel
        let currentCategory = 'fachadas';
        let currentIndex = 0;

        // Elementos do DOM
        const imgLeft = document.getElementById('img-left');
        const imgCenter = document.getElementById('img-center');
        const imgRight = document.getElementById('img-right');
        const labelCategory = document.getElementById('label-category');
        const labelTitle = document.getElementById('label-title');
        const slides = document.querySelectorAll('.premium-gallery-slide');

        // Inicialização
        function initGallery() {
            updateGalleryDisplay(false); // Atualiza sem animação inicial
        }

        // Função para selecionar categoria (Tabs)
        function selectCategory(category) {
            if (currentCategory === category) return; // Evita reprocessar a mesma

            currentCategory = category;
            currentIndex = 0; // Reseta o índice ao trocar de categoria

            // Atualiza os botões das categorias (Tabs)
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-bege-claro', 'text-cor-texto', 'active-btn');
                btn.classList.add('border', 'border-white', 'text-cor-texto');
                btn.setAttribute('aria-selected', 'false');
            });

            const activeBtn = document.getElementById(`tab-${category}`);
            activeBtn.classList.remove('border', 'border-white');
            activeBtn.classList.add('bg-bege-claro', 'text-cor-texto', 'active-btn');
            activeBtn.setAttribute('aria-selected', 'true');

            updateGalleryDisplay(true); // Atualiza com animação de fade
        }

        // Função para navegar entre as imagens
        function navigateGallery(direction) {
            const listLength = galleryData[currentCategory].length;
            // Cálculo do índice circular (0, 1, 2, 3, 4, 5, 0, ...)
            currentIndex = (currentIndex + direction + listLength) % listLength;
            updateGalleryDisplay(true); // Atualiza com animação de fade
        }

        // Função para atualizar o DOM da galeria
        function updateGalleryDisplay(withAnimation) {
            const list = galleryData[currentCategory];
            const listLength = list.length;

            // Calcula os índices das imagens laterais
            const leftIndex = (currentIndex - 1 + listLength) % listLength;
            const rightIndex = (currentIndex + 1) % listLength;

            // Prepara os dados atuais
            const centerItem = list[currentIndex];
            const leftItem = list[leftIndex];
            const rightItem = list[rightIndex];

            // Aplica animação se solicitado
            if (withAnimation) {
                slides.forEach(slide => slide.classList.add('hidden-slide'));

                // Pequeno delay para a troca de imagem (300ms)
                setTimeout(() => {
                    updateImageSources(leftItem, centerItem, rightItem);
                    slides.forEach(slide => slide.classList.remove('hidden-slide'));
                }, 300);
            } else {
                updateImageSources(leftItem, centerItem, rightItem);
            }
        }

        // Helper para trocar as sources das imagens e legendas
        function updateImageSources(left, center, right) {
            imgLeft.src = left.url;
            imgLeft.alt = `Prévia de ${left.title}`;

            imgCenter.src = center.url;
            imgCenter.alt = center.title;

            imgRight.src = right.url;
            imgRight.alt = `Prévia de ${right.title}`;

            labelCategory.textContent = currentCategory;
            labelTitle.textContent = center.title;
        }

        // Inicia a galeria após carregar o DOM
        window.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
